subscribe_action = "Адкрыць форму падпіскі ў beehiiv"
subscription_data = "Адрас электроннай пошты, запіс пра пацвярджэнне згоды і звесткі пра дастаўку лістоў выкарыстоўваюцца для кіравання падпіскай, рассылкі абнаўленняў і пацвярджэння згоды. Лісты адпраўляюцца на падставе вашай згоды (арт. 6(1)(a) GDPR). Адрас указваць добраахвотна, ён патрэбны толькі для падпіскі. Аўтаматызаваныя рашэнні на гэтай падставе не прымаюцца."
