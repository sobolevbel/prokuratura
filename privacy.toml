subscription_retention = "Даныя актыўнай падпіскі захоўваюцца, пакуль яна дзейнічае. Згоду можна адклікаць у любы момант па спасылцы ў кожным лісце або напісаўшы па адрасе вышэй. Адкліканне згоды не ўплывае на законнасць папярэдняй апрацоўкі. Мінімальны запіс пра адпіску можа захоўвацца да закрыцця спіса, каб прадухіліць паўторную рассылку (арт. 6(1)(f) GDPR)."

